id: tesoreria
nombre: Analista de tesorería
descripcion: Cobros por medio de pago, pagos a proveedores, vencimientos y saldos
modelo: claude-sonnet-5-5
esfuerzo: medium
prompt: prompts/tesoreria.md

base_datos:
  credencial_env: DB_URL_TESORERIA      # rol agente_tesoreria_ro (sql/roles_perfiles_area.sql)
  tablas:
    - nombre: public.compras_pago
      descripcion: Pagos a proveedores
      columna_fecha: fecha
      diccionario: prompts/diccionarios/compras_pago.md
    - nombre: public.compras_pago_medio
      descripcion: Medio de cada pago
      columna_fecha: fecha_acreditacion
      diccionario: prompts/diccionarios/compras_pago_medio.md
    - nombre: public.compras_pago_aplicacion
      descripcion: Qué comprobante cancela cada pago
      diccionario: prompts/diccionarios/compras_pago_aplicacion.md
    - nombre: public.compras_compra
      descripcion: Comprobantes de proveedores (importes y vencimientos)
      columna_fecha: fecha
      columnas: [id, proveedor_id, tipo_comprobante, punto_venta, numero, fecha, fecha_vencimiento, condicion_pago, total, saldo_pendiente, estado, categoria]
      diccionario: prompts/diccionarios/compras_compra.md
    - nombre: public.compras_movimiento_cc
      descripcion: Cuenta corriente con proveedores (debe y haber)
      columna_fecha: fecha
      diccionario: prompts/diccionarios/compras_movimiento_cc.md
    - nombre: public.costos_proveedor
      descripcion: Proveedores
      columnas: [id, codigo, nombre, nombre_fantasia, cuit, condicion_iva, condicion_pago, estado, fecha_alta]
      diccionario: prompts/diccionarios/costos_proveedor.md
    - nombre: public.documentos
      descripcion: Comprobantes de caja de Villa Allende y la Dietética (solo columnas de cobro)
      columna_fecha: fechadocumento
      columnas: [iddocumento, idcaja, idcajaapertura, fechadocumento, tipodocumento, prefijodocumento, nrodocumento, idvendedor, pagoefectivo, pagoefectivoneto, pagovuelto, idtarjeta, pagotarjeta, cuotastarjeta, idtipodescuento, descuento, porcdescuento, recargo, valorapagar, subtotal, iva, docanulado, condventa, estadodoc]
      diccionario: prompts/diccionarios/documentos.md
    - nombre: public.cajas
      descripcion: Cajas de Villa Allende y la Dietética
      columnas: [idcaja, nombre, activa, estadocaja]
      diccionario: prompts/diccionarios/cajas.md

herramientas: [describir_tabla, consultar, solicitar_aclaraciones, generar_artifact, editar_artifact]

limites:
  max_filas: 500
  timeout_sql_seg: 60
  max_herramientas_por_turno: 25
  presupuesto_tokens_por_turno: 200000
