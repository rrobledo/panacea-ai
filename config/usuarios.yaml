# Usuarios con acceso a la app y sus perfiles. Un email que no figure acá no puede entrar.
# admin: true ve todas las conversaciones y reportes, y el tablero de uso.
# tope_mensual_usd: costo estimado de API por usuario y mes calendario; al alcanzarlo, el chat
# responde 429 hasta el mes siguiente. Un usuario puede tener su propio tope (ampliarlo = editarlo acá).
#
# Ejemplo:
#   usuarios:
#     - { email: ventas1@example.com,   perfiles: [ventas] }
#     - { email: gerencia@example.com,  perfiles: [ventas], admin: true, tope_mensual_usd: 100 }
tope_mensual_usd: 50
usuarios:
