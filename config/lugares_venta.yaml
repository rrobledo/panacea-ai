# Ubicación de cada lugar de venta (lugar_venta_id de panacea_sales_v2).
# La usan las herramientas de variables externas para pedir el clima a Open-Meteo.
# Solo se envían las coordenadas y las fechas: ningún dato de ventas sale del sistema.
#
# perfil: residencial | turistico | eventos | capital | sin_ubicacion
# Un lugar sin lat/lon no tiene clima (las demás variables sí se calculan).

zona_horaria: America/Argentina/Cordoba

lugares:
