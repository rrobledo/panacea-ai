# Calendario externo: lo que las APIs no traen.
# Los feriados nacionales vienen de Nager.Date (date.nager.at). Acá van los días no laborables,
# las temporadas, los eventos locales y el aguinaldo.
#
# estado: confirmado (fuente oficial o de prensa verificada) | a_confirmar
# lugares: ids de config/lugares_venta.yaml; omitido = todos.
# Revisar este archivo cada trimestre (próxima revisión: febrero de 2027).
actualizado: 2026-11-14

# Días no laborables con fines turísticos (Ley 27.399) y Jueves Santo.
# El Jueves Santo de cada año se calcula solo; no hace falta cargarlo.
no_laborables:
  - {fecha: 2024-04-01, nombre: Puente turístico, estado: a_confirmar}   # Decreto 106/2023
  - {fecha: 2024-06-21, nombre: Puente turístico, estado: a_confirmar}
  - {fecha: 2024-10-11, nombre: Puente turístico, estado: a_confirmar}
  - {fecha: 2025-05-02, nombre: Día no laborable con fines turísticos, estado: confirmado}   # Decreto 1027/2024
  - {fecha: 2025-08-15, nombre: Día no laborable con fines turísticos, estado: confirmado}
  - {fecha: 2025-11-21, nombre: Día no laborable con fines turísticos, estado: confirmado}
  - {fecha: 2026-03-23, nombre: Día no laborable con fines turísticos, estado: confirmado}   # Resolución JGM 164/2025
  - {fecha: 2026-07-10, nombre: Día no laborable con fines turísticos, estado: confirmado}
  - {fecha: 2026-12-07, nombre: Día no laborable con fines turísticos, estado: confirmado}

# Temporadas. Las de verano y Semana Santa se calculan solas (verano: 15/12 al 15/03;
# Semana Santa: de Jueves Santo a Domingo de Pascua). Acá van las vacaciones de invierno de Córdoba.
vacaciones_invierno:
  - {desde: 2023-07-10, hasta: 2023-07-21, estado: a_confirmar}
  - {desde: 2024-07-08, hasta: 2024-07-19, estado: a_confirmar}
  - {desde: 2025-07-07, hasta: 2025-07-18, estado: a_confirmar}
  - {desde: 2026-07-06, hasta: 2026-07-17, estado: confirmado}
  - {desde: 2027-07-05, hasta: 2027-07-16, estado: a_confirmar}

# Eventos locales. Cargar también las ediciones pasadas: sirven para medir su efecto.
eventos:
  # Villa General Belgrano (id 4)
  - {nombre: Oktoberfest, lugares: [4], desde: 2024-10-04, hasta: 2024-10-13, estado: a_confirmar}
  - {nombre: Oktoberfest, lugares: [4], desde: 2025-11-21, hasta: 2025-11-30, estado: a_confirmar}  # se pasó a noviembre; 2.º fin de semana sin verificar
  - {nombre: Oktoberfest, lugares: [4], desde: 2026-10-02, hasta: 2026-10-12, estado: confirmado}   # 2–4 y 9–12/10
  - {nombre: Oktoberfest, lugares: [4], desde: 2027-10-01, hasta: 2027-10-11, estado: a_confirmar}
  - {nombre: Fiesta de la Masa Vienesa, lugares: [4], desde: 2027-03-25, hasta: 2027-03-28, estado: a_confirmar}
  - {nombre: Fiesta del Chocolate Alpino, lugares: [4], desde: 2027-07-05, hasta: 2027-07-16, estado: a_confirmar}

  # Villa Carlos Paz (id 2): temporada teatral de verano
  - {nombre: Temporada teatral, lugares: [2], desde: 2024-12-26, hasta: 2025-03-09, estado: a_confirmar}
  - {nombre: Temporada teatral, lugares: [2], desde: 2025-12-26, hasta: 2026-03-08, estado: a_confirmar}
  - {nombre: Temporada teatral, lugares: [2], desde: 2026-12-26, hasta: 2027-03-07, estado: a_confirmar}

# Aguinaldo: ventanas de cobro de cada cuota (se aplica todos los años).
aguinaldo:
  - {desde_dia: 15, hasta_dia: 30, mes: 6}
  - {desde_dia: 15, hasta_dia: 31, mes: 12}
